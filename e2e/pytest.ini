[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: tests rapides de non-régression
    auth: authentification et contrôle d'accès
    cars: catalogue de voitures
    reservation: parcours de réservation
    admin: back-office administrateur
    contact: formulaire de contact
